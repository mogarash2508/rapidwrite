name: handwriting_evaluator
description: >-
  Cross-platform tablet application (Android Tablets & Apple iPads) for
  stylus-based handwriting analysis, strict palm rejection, independent
  kinematic writing speed calculation, fixed-timer sentence auto-disappearance,
  and holistic aesthetic evaluation using Google ML Kit Digital Ink Recognition
  and multimodal vision analysis.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # On-device handwriting recognition (Google ML Kit Digital Ink)
  google_mlkit_digital_ink_recognition: ^0.12.0
  google_mlkit_commons: ^0.8.1

  # High-resolution canvas snapshot capture
  screenshot: ^3.0.0
  widgets_to_image: ^1.0.0

  # Networking client for sending canvas screenshots to Vision AI evaluation layer
  http: ^1.2.2

  # UI & utilities
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
